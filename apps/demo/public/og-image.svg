<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#09090b" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Logo mark -->
  <g transform="translate(96, 232) scale(7)">
    <rect x="3" y="3" width="18" height="18" rx="4" fill="url(#brand)" opacity="0.18" />
    <rect x="6" y="6" width="12" height="12" rx="3" fill="url(#brand)" opacity="0.4" />
    <rect x="9" y="9" width="6" height="6" rx="1.5" fill="url(#brand)" />
  </g>

  <!-- Wordmark -->
  <text x="320" y="300" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="128" font-weight="800" fill="url(#brand)">Editx</text>

  <!-- Tagline -->
  <text x="322" y="372" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="500" fill="#a1a1aa">Open-source image editor for React</text>

  <!-- Feature row -->
  <text x="322" y="440" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="500" fill="#71717a">Crop  ·  Adjust  ·  Filter  ·  Text  ·  Shapes  ·  Export</text>
</svg>
