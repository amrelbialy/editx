name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  check:
    name: Lint & format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome CI (format + lint + import sorting)
        run: pnpm exec biome ci .

  test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Unit & integration tests (with engine coverage gate)
        run: pnpm test:coverage

  e2e:
    name: Component & journey tests (Playwright)
    runs-on: ubuntu-latest
    # Allow the job to commit newly seeded Linux visual baselines back to the branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @editx/image-editor exec playwright install --with-deps chromium

      # Auto-writes only *missing* OS-specific baselines (first-time seed) so they
      # never block CI; existing baselines are still compared and fail on real diffs.
      - name: Playwright component tests
        run: pnpm --filter @editx/image-editor exec playwright test -c playwright-ct.config.js --update-snapshots=missing

      # Persist any newly seeded baselines on branch pushes (skips forks/PRs).
      - name: Commit seeded snapshots
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/image-editor/tests/snapshots
          if git diff --cached --quiet; then
            echo "No new snapshots to commit."
          else
            git commit -m "test(image-editor): seed missing visual snapshots [skip ci]"
            git push
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/image-editor/playwright-report/
          retention-days: 7
